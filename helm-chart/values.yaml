# Default values for onlineboutique.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  repository: proget.assim.mapn:8625/docker-registry/microservices-demo
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Note: A custom image can also be specified per component (via customImage or image) to take precedence over the global repository and tag.

serviceAccounts:
  # Specifies whether service accounts should be created.
  create: true
  # Annotations to add to the service accounts.
  annotations: {}
  # Annotations to add only for the cartservice app. This allows to follow the least privilege principle where only cartservice needs to connect to external database for example via Workload Identity.
  annotationsOnlyForCartservice: false

networkPolicies:
  # Specifies if the NetworkPolicies are created or not. If true, one fine granular NetworkPolicy per app is created.
  create: false

sidecars:
  # Specifies if the Sidecars are created or not. If true, one fine granular Sidecar per app is created.
  create: false

authorizationPolicies:
  # Specifies if the AuthorizationPolicies are created or not. If true, one fine granular AuthorizationPolicy per app is created.
  create: false

opentelemetryCollector:
  create: false
  name: opentelemetrycollector
  # Provide a custom image to take precedence over the default otel image.
  customImage: ""
  # Specifies the project id for the otel collector. If set as "PROJECT_ID" (default value), an initContainer will automatically retrieve the project id value from the metadata server.
  projectId: "PROJECT_ID"

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

seccompProfile:
  enable: false
  type: RuntimeDefault

securityContext:
  enable: true

adService:
  create: true
  name: adservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi

cartService:
  create: true
  name: cartservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

checkoutService:
  create: true
  name: checkoutservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

currencyService:
  create: true
  name: currencyservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

emailService:
  create: true
  name: emailservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

frontend:
  create: true
  name: frontend
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: "proget.assim.mapn:8625/docker-registry/microservices-demo/frontend:v0.10.7-v3"
  # Lifecycle hooks for container. Note: preStop exec requires a shell (like /bin/sh) in the image.
  # If using a scratch image, handle the delay in Go (time.Sleep) instead of using an exec hook.
  lifecycle: {}
  # Example if your image has a shell:
  # lifecycle:
  #   preStop:
  #     exec:
  #       command: ["/bin/sh", "-c", "sleep 5"]
  # Grace period for pod shutdown (in seconds)
  terminationGracePeriodSeconds: 30
  # Horizontal Pod Autoscaler configuration
  autoscaling:
    enable: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""
  externalService: true
  cymbalBranding: false
  singleSharedSession: false
  virtualService:
    create: false
    hosts:
    - "*"
    gateway:
      name: asm-ingressgateway
      namespace: asm-ingress
      labelKey: asm
      labelValue: ingressgateway
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

loadGenerator:
  create: true
  name: loadgenerator
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  checkFrontendInitContainer: true
  # Number of simulated concurrent users
  users: 10
  # Rate per second in which users are spawned
  rate: 1
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

paymentService:
  create: true
  name: paymentservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

productCatalogService:
  create: true
  name: productcatalogservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  # Specifies an extra latency to any request on productcatalogservice, by default no extra latency.
  extraLatency: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

recommendationService:
  create: true
  name: recommendationservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 200m
      memory: 450Mi

shippingService:
  create: true
  name: shippingservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

cartDatabase:
  # Specifies the type of the cartservice's database, could be either redis or spanner.
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    # Uses the public redis image from Docker Hub, otherwise will use the images.repository.
    publicRepository: true
    # Provide a custom image to take precedence over the default redis image and global images.repository.
    customImage: ""
    # PersistentVolumeClaim for the Redis append-only file, so carts survive restarts.
    storage: 1Gi
    storageClassName: ""
  externalRedisTlsOrigination:
    enable: false
    name: exernal-redis-tls-origination
    endpointAddress: ""
    endpointPort: ""
    certificate: ""

# @TODO: This service is not currently available in Helm.
# https://github.com/GoogleCloudPlatform/microservices-demo/tree/main/kustomize/components/shopping-assistant
shoppingAssistantService:
  create: false
  name: shoppingassistantservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""

userService:
  create: true
  name: userservice
  # Provide a custom image to take precedence over the global images.repository and tag.
  customImage: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Key used to sign login tokens (HS256), at least 32 characters. Leave empty to
  # generate one on first install; it is then kept across upgrades.
  jwtSecret: ""
  # Use a Secret you manage instead of the chart's. It must contain the keys
  # "db-password" and "jwt-secret". When set, jwtSecret and
  # userDatabase.dbPassword are ignored.
  existingSecret: ""

userDatabase:
  type: postgres
  dbName: usersdb
  dbUser: shopuser
  # Leave empty to generate one on first install; it is then kept across
  # upgrades. Postgres only reads it when it initialises a new volume.
  dbPassword: ""
  # Connection settings for an external Postgres, used when
  # inClusterPostgres.create is false.
  externalHost: ""
  port: 5432
  # libpq sslmode: disable, prefer, require, verify-ca or verify-full.
  sslMode: prefer
  inClusterPostgres:
    create: true
    name: postgres-user
    # Uses the public postgres image from Docker Hub, otherwise will use the images.repository.
    publicRepository: true
    # Provide a custom image to take precedence over the default postgres image and global images.repository.
    customImage: ""
    storage: 1Gi
    storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
