{{- if .Values.userService.create }}
{{- $secretName := .Values.userService.existingSecret | default (printf "%s-secret" .Values.userService.name) }}
{{- $pg := .Values.userDatabase.inClusterPostgres }}
{{- $dbHost := .Values.userDatabase.externalHost }}
{{- if $pg.create }}
{{- $dbHost = $pg.name }}
{{- else if not $dbHost }}
{{- fail "userDatabase.externalHost is required when userDatabase.inClusterPostgres.create is false" }}
{{- end }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ .Release.Namespace }}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
{{- if not .Values.userService.existingSecret }}
{{- /*
  Credentials are never given defaults. Unless set explicitly, they are
  generated on first install and read back from the cluster on upgrade, so they
  stay stable. Postgres only reads its password when it first initialises the
  volume, so db-password must not change while the data volume exists.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = $existing.data }}
{{- end }}
{{- $dbPassword := .Values.userDatabase.dbPassword }}
{{- if not $dbPassword }}
{{- $dbPassword = (get $existingData "db-password" | b64dec) | default (randAlphaNum 40) }}
{{- end }}
{{- $jwtSecret := .Values.userService.jwtSecret }}
{{- if not $jwtSecret }}
{{- $jwtSecret = (get $existingData "jwt-secret" | b64dec) | default (randAlphaNum 48) }}
{{- end }}
{{- if lt (len $jwtSecret) 32 }}
{{- fail "userService.jwtSecret must be at least 32 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Keep the credentials on uninstall: the Postgres volume outlives the
    # release, and a reinstall must reuse the same password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  db-password: {{ $dbPassword | b64enc | quote }}
  jwt-secret: {{ $jwtSecret | b64enc | quote }}
---
{{- end }}
{{- if $pg.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $pg.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $pg.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $pg.name }}
spec:
  serviceName: {{ $pg.name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ $pg.name }}
  template:
    metadata:
      labels:
        app: {{ $pg.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ $pg.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.securityContext.enable }}
      securityContext:
        # uid/gid 70 is the "postgres" user in the official Alpine image.
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: postgres
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        {{- if $pg.customImage }}
        image: {{ $pg.customImage }}
        {{- else if $pg.image }}
        image: {{ $pg.image }}
        {{- else if $pg.publicRepository }}
        image: postgres:15-alpine
        {{- else }}
        image: {{ .Values.images.repository }}/postgres:15-alpine
        {{- end }}
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: {{ .Values.userDatabase.dbName | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.userDatabase.dbUser | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: db-password
        # A subdirectory, because a fresh volume's root may contain lost+found,
        # which makes initdb refuse to run.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml $pg.resources | nindent 10 }}
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.userDatabase.dbUser | quote }}, "-d", {{ .Values.userDatabase.dbName | quote }}]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.userDatabase.dbUser | quote }}, "-d", {{ .Values.userDatabase.dbName | quote }}]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      {{- if $pg.storageClassName }}
      storageClassName: {{ $pg.storageClassName | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ $pg.storage | default "1Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $pg.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $pg.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $pg.name }}
  ports:
  - name: tcp-postgres
    port: 5432
    targetPort: 5432
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $pg.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $pg.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.userService.name }}
    ports:
     - port: 5432
       protocol: TCP
  egress:
  - {}
{{- end }}
{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ $pg.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ $pg.name }}
  egress:
  - hosts:
    - istio-system/*
{{- end }}
{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ $pg.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ $pg.name }}
  rules:
  - from:
    - source:
        principals:
        {{- if .Values.serviceAccounts.create }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.userService.name }}
        {{- else }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/default
        {{- end }}
    to:
    - operation:
        ports:
        - "5432"
{{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.userService.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.userService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.userService.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.userService.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 5
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        {{- if .Values.userService.customImage }}
        image: {{ .Values.userService.customImage }}
        {{- else if .Values.userService.image }}
        image: {{ .Values.userService.image }}
        {{- else }}
        image: {{ .Values.images.repository }}/{{ .Values.userService.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
        {{- end }}
        ports:
        - containerPort: 50052
        env:
        - name: PORT
          value: "50052"
        - name: DB_HOST
          value: {{ $dbHost | quote }}
        - name: DB_PORT
          value: {{ .Values.userDatabase.port | default 5432 | quote }}
        - name: DB_NAME
          value: {{ .Values.userDatabase.dbName | quote }}
        - name: DB_USER
          value: {{ .Values.userDatabase.dbUser | quote }}
        - name: DB_SSLMODE
          value: {{ .Values.userDatabase.sslMode | default "prefer" | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: jwt-secret
        {{- if .Values.opentelemetryCollector.create }}
        - name: COLLECTOR_SERVICE_ADDR
          value: "{{ .Values.opentelemetryCollector.name }}:4317"
        - name: OTEL_SERVICE_NAME
          value: "{{ .Values.userService.name }}"
        {{- end }}
        {{- if .Values.googleCloudOperations.tracing }}
        - name: ENABLE_TRACING
          value: "1"
        {{- else }}
        - name: ENABLE_TRACING
          value: "0"
        {{- end }}
        resources:
          {{- toYaml .Values.userService.resources | nindent 10 }}
        # Readiness includes a database check; liveness deliberately does not,
        # so a database outage takes pods out of rotation without restarting them.
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 10
          grpc:
            port: 50052
            service: hipstershop.UserService
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          grpc:
            port: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.userService.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.userService.name }}
  ports:
  - name: grpc
    port: 50052
    targetPort: 50052
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.userService.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.frontend.name }}
    ports:
     - port: 50052
       protocol: TCP
  egress:
  - {}
{{- end }}
{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ .Values.userService.name }}
  egress:
  - hosts:
    - istio-system/*
    {{- if $pg.create }}
    - ./{{ $pg.name }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- end }}
    {{- if .Values.opentelemetryCollector.create }}
    - ./{{ .Values.opentelemetryCollector.name }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- end }}
{{- end }}
{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.userService.name }}
  rules:
  - from:
    - source:
        principals:
        {{- if .Values.serviceAccounts.create }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.frontend.name }}
        {{- else }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/default
        {{- end }}
    to:
    - operation:
        methods:
        - POST
        ports:
        - "50052"
{{- end }}
{{- end }}
