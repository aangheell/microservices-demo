# Based on Google's Online Boutique CI (Apache 2.0), adapted to build, push and
# deploy to a lab Kubernetes cluster through a self-hosted ARC runner.

name: "Continuous Integration - Main/Release"
on:
  workflow_dispatch:   # lets you start a run manually from the Actions tab
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**/README.md'
      - 'kustomize/**'
      - '.github/workflows/kustomize-build-ci.yaml'
      - 'terraform/**'
      - '.github/workflows/terraform-validate-ci.yaml'
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-ci.yaml'

permissions:
  contents: read
  packages: write   # lets GITHUB_TOKEN push images to ghcr.io

# never run two deployments to the lab cluster at the same time
concurrency:
  group: lab-deploy
  cancel-in-progress: false

jobs:
  code-tests:
    runs-on: [self-hosted, lab-k8s]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      env:
        DOTNET_INSTALL_DIR: "./.dotnet"
      with:
        dotnet-version: '9.0'
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
    - name: Go Unit Tests
      timeout-minutes: 10
      run: |
        for SERVICE in "shippingservice" "productcatalogservice" "frontend"; do
          echo "testing $SERVICE..."
          pushd src/$SERVICE
          go test
          popd
        done
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Python Unit Tests
      timeout-minutes: 10
      run: |
        python -m venv "$RUNNER_TEMP/userservice-venv"
        . "$RUNNER_TEMP/userservice-venv/bin/activate"
        pip install -q -r src/userservice/requirements.txt pytest
        cd src/userservice && python -m pytest -q
    - name: C# Unit Tests
      timeout-minutes: 10
      run: |
        dotnet test src/cartservice/

  deploy-to-lab:
    runs-on: [self-hosted, lab-k8s]
    needs: code-tests
    env:
      NAMESPACE: boutique-ci
      REGISTRY_HOST: ghcr.io
      REGISTRY: ghcr.io/aangheell/microservices-demo
    steps:
    - uses: actions/checkout@v5

    - name: Install kubectl and skaffold
      run: |
        mkdir -p "$HOME/bin"
        KVER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
        curl -fsSL -o "$HOME/bin/kubectl" "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
        curl -fsSL -o "$HOME/bin/skaffold" https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
        chmod +x "$HOME/bin/kubectl" "$HOME/bin/skaffold"
        # docker buildx plugin (the runner image's docker CLI doesn't ship it)
        mkdir -p "$HOME/.docker/cli-plugins"
        curl -fsSL -o "$HOME/.docker/cli-plugins/docker-buildx" \
          https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64
        chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
        docker buildx version
        echo "$HOME/bin" >> "$GITHUB_PATH"

    - name: Configure kubectl from the runner's ServiceAccount
      run: |
        SA=/var/run/secrets/kubernetes.io/serviceaccount
        kubectl config set-cluster lab --server=https://kubernetes.default.svc --certificate-authority=$SA/ca.crt
        kubectl config set-credentials runner --token="$(cat $SA/token)"
        kubectl config set-context lab --cluster=lab --user=runner --namespace="$NAMESPACE"
        kubectl config use-context lab
        kubectl auth can-i create deployments -n "$NAMESPACE"

    - name: Log in to GHCR
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      run: |
        echo "$GHCR_TOKEN" | docker login "$REGISTRY_HOST" -u aangheell --password-stdin

    - name: Ensure userservice secret exists
      run: |
        # Creates random credentials on first deploy only; never rotates them.
        ./kustomize/components/user-service/create-secret.sh "$NAMESPACE"

    - name: Build + push images, deploy to lab cluster
      timeout-minutes: 40
      run: |
        skaffold config set --global local-cluster false
        # GHCR sometimes answers "denied" for a push that works on retry, so retry.
        # Images already pushed are skipped on the next attempt.
        ok=0
        for i in 1 2 3 4 5; do
          if skaffold run --default-repo="$REGISTRY" --tag="$GITHUB_SHA" \
               --namespace="$NAMESPACE" --platform=linux/amd64 --build-concurrency=1 \
               --status-check=false; then
            ok=1
            break
          fi
          echo "skaffold run failed (attempt $i of 5), retrying in 20s"
          sleep 20
        done
        [ "$ok" = 1 ]

    - name: Diagnose build environment
      if: failure()
      run: |
        # Each command may fail (e.g. a dead daemon); keep going and show what we can.
        echo "::group::docker info"; docker info || true; echo "::endgroup::"
        echo "::group::docker disk usage"; docker system df || true; echo "::endgroup::"
        echo "::group::runner disk"; df -h || true; echo "::endgroup::"
        echo "::group::runner memory"; free -m || true; echo "::endgroup::"
        # Restart count and last state (e.g. OOMKilled) of the docker sidecar.
        # Needs "get pods" on actions-runner-system for the arc-runner SA.
        echo "::group::runner pod status"
        kubectl get pod "$HOSTNAME" -n actions-runner-system \
          -o jsonpath='{range .status.containerStatuses[*]}{.name}{" restarts="}{.restartCount}{" last="}{.lastState}{"\n"}{end}' \
          || echo "(no permission to read runner pod)"
        echo "::endgroup::"

    - name: Attach GHCR pull secret to ServiceAccounts
      run: |
        # Online Boutique gives each service its own ServiceAccount, so the secret
        # has to be on all of them, not only "default".
        for SA in $(kubectl get sa -n "$NAMESPACE" -o name); do
          kubectl patch "$SA" -n "$NAMESPACE" -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
        done
        # Pods created before the patch don't carry the secret: recreate the stuck ones.
        kubectl get pods -n "$NAMESPACE" --no-headers \
          | awk '/ImagePullBackOff|ErrImagePull/ {print $1}' \
          | xargs -r kubectl delete pod -n "$NAMESPACE"

    - name: Wait for pods
      timeout-minutes: 20
      run: |
        for D in redis-cart adservice cartservice checkoutservice currencyservice \
                 emailservice frontend loadgenerator paymentservice \
                 productcatalogservice recommendationservice shippingservice \
                 userservice; do
          kubectl wait --for=condition=available --timeout=1000s deployment/$D -n "$NAMESPACE"
        done
        kubectl rollout status statefulset/postgres-user --timeout=600s -n "$NAMESPACE"

    - name: Smoke test
      timeout-minutes: 5
      run: |
        set -x
        # start fresh loadgenerator pod
        kubectl delete pod -l app=loadgenerator -n "$NAMESPACE"
        kubectl wait --for=condition=available --timeout=300s deployment/loadgenerator -n "$NAMESPACE"
        # wait for requests to come in
        REQUEST_COUNT="0"
        while [[ "${REQUEST_COUNT:-0}" -lt "50" ]]; do
            sleep 5
            REQUEST_COUNT=$(kubectl logs -l app=loadgenerator -n "$NAMESPACE" | grep Aggregated | awk '{print $2}')
        done
        # ensure there are no errors hitting endpoints
        ERROR_COUNT=$(kubectl logs -l app=loadgenerator -n "$NAMESPACE" | grep Aggregated | awk '{print $3}' | sed "s/[(][^)]*[)]//g")
        if [[ "${ERROR_COUNT:-0}" -gt "0" ]]; then
          exit 1
        fi
