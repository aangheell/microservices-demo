# Pull request checks: unit tests plus a build of every image the PR changes,
# on the lab runner. Nothing is pushed or deployed; ci-main.yaml does that
# after merge.

name: "Continuous Integration - Pull Request"
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'kustomize/**'
      - '.github/workflows/kustomize-build-ci.yaml'
      - 'terraform/**'
      - '.github/workflows/terraform-validate-ci.yaml'
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-ci.yaml'

permissions:
  contents: read

# Only the newest commit of a PR matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-tests:
    # The repo is public and the lab runner can reach the cluster, so never run
    # code from a fork's PR on it. PRs from branches of this repo only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lab-k8s]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      env:
        DOTNET_INSTALL_DIR: "./.dotnet"
      with:
        dotnet-version: '9.0'
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false
    - name: Go Unit Tests
      timeout-minutes: 10
      run: |
        # ./... so sub-packages (frontend/money, frontend/validator,
        # checkoutservice/money) are tested too.
        for SERVICE in shippingservice productcatalogservice frontend checkoutservice; do
          echo "testing $SERVICE..."
          (cd src/$SERVICE && go test ./...)
        done
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Python Unit Tests
      timeout-minutes: 10
      run: |
        python -m venv "$RUNNER_TEMP/userservice-venv"
        . "$RUNNER_TEMP/userservice-venv/bin/activate"
        pip install -q -r src/userservice/requirements.txt pytest
        cd src/userservice && python -m pytest -q
    - name: C# Unit Tests
      timeout-minutes: 10
      run: |
        dotnet test src/cartservice/

  build-images:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lab-k8s]
    needs: code-tests
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
    - uses: actions/checkout@v5

    - name: Install skaffold
      run: |
        mkdir -p "$HOME/bin"
        curl -fsSL -o "$HOME/bin/skaffold" https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
        chmod +x "$HOME/bin/skaffold"
        echo "$HOME/bin" >> "$GITHUB_PATH"

    # GHCR packages are private; log in so the "already built?" check below
    # can see them. Same secret as ci-main. Fork PRs never reach this job.
    - name: Log in to GHCR
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      run: |
        echo "$GHCR_TOKEN" | docker login ghcr.io -u aangheell --password-stdin

    - name: Build changed images (no push)
      timeout-minutes: 40
      run: |
        skaffold config set --global local-cluster false
        # Same idea as ci-main: an image whose input-digest tag is already in
        # GHCR is unchanged, so skip it. Build the rest one at a time and
        # prune after each, so the runner's disk doesn't fill up.
        IMAGES="emailservice productcatalogservice recommendationservice shippingservice
                checkoutservice paymentservice currencyservice cartservice frontend
                adservice userservice loadgenerator"
        BUILT=""
        for IMG in $IMAGES; do
          TAG=$(skaffold build -b "$IMG" --default-repo="$REGISTRY" --dry-run -q | jq -r '.builds[0].tag')
          if [ -n "$TAG" ] && docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "$IMG unchanged"
            continue
          fi
          echo "::group::building $IMG"
          skaffold build -b "$IMG" --default-repo="$REGISTRY" --push=false --platform=linux/amd64
          echo "::endgroup::"
          docker system prune -af >/dev/null
          BUILT="$BUILT $IMG"
        done
        echo "built:${BUILT:- nothing (no image inputs changed)}" | tee -a "$GITHUB_STEP_SUMMARY"
