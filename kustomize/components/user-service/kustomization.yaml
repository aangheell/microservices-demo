# Adds user accounts (sign in / register): userservice, its Postgres database,
# and the frontend settings that turn the feature on.
# Requires the "userservice-secret" Secret; see README.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- userservice.yaml
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: USER_SERVICE_ADDR
              value: "userservice:50052"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: userservice-secret
                  key: jwt-secret
# Checkout records signed-in users' orders for their order history.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: checkoutservice
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: USER_SERVICE_ADDR
              value: "userservice:50052"
