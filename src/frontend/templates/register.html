{{ define "register" }}

{{ template "header" . }}

<div {{ with $.platform_css }} class="{{.}}" {{ end }}>
  <span class="platform-flag">
    {{$.platform_name}}
  </span>
</div>

<main role="main">
  <div class="py-5 bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-sm border-0" style="border-radius: 8px;">
            <div class="card-body p-4 p-md-5">
              <h3 class="card-title text-center mb-4" style="font-weight: 700; color: #1e293b;">Create Account</h3>
              
              {{ if $.error }}
              <div class="alert alert-danger text-center" role="alert">
                {{ $.error }}
              </div>
              {{ end }}

              <form method="POST" action="{{ $.baseUrl }}/register">
                <input type="hidden" name="csrf_token" value="{{ $.csrf_token }}">
                <div class="form-group mb-3">
                  <label for="name" style="font-size: 14px; font-weight: 500; color: #475569;">Full Name</label>
                  <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="John Doe" required autofocus style="font-size: 15px;">
                </div>
                <div class="form-group mb-3">
                  <label for="email" style="font-size: 14px; font-weight: 500; color: #475569;">Email address</label>
                  <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="name@example.com" required style="font-size: 15px;">
                </div>
                <div class="form-group mb-4">
                  <label for="password" style="font-size: 14px; font-weight: 500; color: #475569;">Password</label>
                  <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="At least 8 characters" required minlength="8" maxlength="72" autocomplete="new-password" style="font-size: 15px;">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg w-100" style="background-color: #1168f0; border-color: #1168f0; font-size: 16px; font-weight: 600; padding: 12px; border-radius: 6px;">Register</button>
              </form>

              <hr class="my-4">

              <div class="text-center" style="font-size: 14px; color: #64748b;">
                Already have an account? <a href="{{ $.baseUrl }}/login" style="color: #1168f0; font-weight: 600; text-decoration: none;">Sign In</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

{{ template "footer" . }}

{{ end }}
