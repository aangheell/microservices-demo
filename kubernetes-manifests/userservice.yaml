apiVersion: v1
kind: Secret
metadata:
  name: userservice-secret
type: Opaque
stringData:
  db-password: "shoppassword"
  jwt-secret: "online-boutique-jwt-secret-key-change-in-prod"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-user-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-user
  labels:
    app: postgres-user
spec:
  serviceName: postgres-user
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "usersdb"
        - name: POSTGRES_USER
          value: "shopuser"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: userservice-secret
              key: db-password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "shopuser", "-d", "usersdb"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "shopuser", "-d", "usersdb"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-user-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  labels:
    app: postgres-user
spec:
  type: ClusterIP
  selector:
    app: postgres-user
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  labels:
    app: userservice
spec:
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      serviceAccountName: userservice
      imagePullSecrets:
      - name: ghcr-pull
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: ghcr.io/aangheell/microservices-demo/userservice:test
        imagePullPolicy: Always
        ports:
        - containerPort: 50052
        env:
        - name: PORT
          value: "50052"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: userservice-secret
              key: db-password
        - name: DB_URL
          value: "postgresql://shopuser:$(DB_PASSWORD)@postgres-user:5432/usersdb"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: userservice-secret
              key: jwt-secret
        - name: ENABLE_TRACING
          value: "0"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          grpc:
            port: 50052
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          grpc:
            port: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  labels:
    app: userservice
spec:
  type: ClusterIP
  selector:
    app: userservice
  ports:
  - name: grpc
    port: 50052
    targetPort: 50052
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: userservice
imagePullSecrets:
- name: ghcr-pull
